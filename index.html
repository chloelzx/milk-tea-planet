<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奶茶星球 Milk Tea Planet</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;600;700;800&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --milk-tea: #F5E6D3;
  --milk-tea-deep: #E8D5BE;
  --brown: #C4A882;
  --brown-dark: #A68B6B;
  --pink: #F2D7D9;
  --pink-deep: #E8B4B8;
  --cream: #FFF8F0;
  --text: #5D4E37;
  --text-light: #8B7355;
  --grape: #9B6BA3;
  --grape-light: #D4B5DC;
  --grape-bg: #F3E8F5;
  --red-gold: #C4463A;
  --gold: #D4A853;
  --red-gold-bg: #FAE8E6;
  --cha-yan: #C4956A;
  --cha-yan-pink: #D4A08A;
  --cha-yan-bg: #F5EAE0;
  --jasmine: #7BAE7F;
  --jasmine-light: #B8D9BA;
  --jasmine-bg: #EDF5EE;
  --mixue-red: #E23D3D;
  --mixue-yellow: #F5D547;
  --mixue-bg: #FFF0F0;
}

html, body {
  height: 100%;
  font-family: 'Nunito', 'ZCOOL KuaiLe', sans-serif;
  background: linear-gradient(170deg, var(--cream) 0%, var(--milk-tea) 50%, var(--pink) 100%);
  color: var(--text);
  overflow: hidden;
}

/* ============ APP LAYOUT ============ */
#app {
  display: flex;
  height: 100vh;
  height: 100dvh;
  max-width: 1200px;
  margin: 0 auto;
}

/* ============ LEFT PANEL ============ */
.left-panel {
  width: 360px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 24px 20px;
  border-right: 1px solid rgba(196, 168, 130, 0.15);
  overflow-y: auto;
  gap: 20px;
}

.left-panel::-webkit-scrollbar { width: 3px; }
.left-panel::-webkit-scrollbar-thumb { background: var(--brown); border-radius: 3px; opacity: 0.3; }

/* Planet (compact) */
.planet-section {
  text-align: center;
  cursor: pointer;
}

.planet-section h1 {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 22px;
  color: var(--brown-dark);
  letter-spacing: 2px;
}

.planet-section .subtitle {
  font-size: 11px;
  color: var(--text-light);
  opacity: 0.6;
  margin-top: 4px;
}

.planet-wrap {
  width: 160px;
  height: 160px;
  margin: 12px auto 0;
  animation: float 4s ease-in-out infinite;
  transition: transform 0.3s;
}

.planet-wrap:hover { transform: scale(1.05); }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.planet-body { fill: var(--milk-tea); stroke: var(--brown); stroke-width: 1.5; }
.planet-surface { fill: none; stroke: var(--brown); stroke-width: 0.8; opacity: 0.2; }

.brand-element {
  opacity: 0.15;
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.brand-element.collected { opacity: 1; }
.brand-element.just-collected { animation: pop-in 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }

@keyframes pop-in {
  0% { transform: scale(0); opacity: 0; }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); opacity: 1; }
}

.celebration-star {
  position: absolute;
  width: 8px; height: 8px;
  background: var(--gold);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  animation: star-burst 1s ease-out forwards;
  pointer-events: none;
}

@keyframes star-burst {
  0% { transform: scale(0) rotate(0); opacity: 1; }
  100% { transform: scale(1.5) rotate(180deg) translateY(-40px); opacity: 0; }
}

/* ============ CALENDAR ============ */
.calendar-section {
  background: rgba(255,255,255,0.45);
  border-radius: 18px;
  padding: 16px;
  border: 1.5px solid rgba(196,168,130,0.12);
}

.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.cal-header h3 {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 15px;
  color: var(--brown-dark);
}

.cal-nav {
  display: flex;
  gap: 6px;
}

.cal-nav button {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid rgba(196,168,130,0.2);
  background: white;
  color: var(--text-light);
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.cal-nav button:hover { background: var(--milk-tea); }

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 10px;
  color: var(--text-light);
  margin-bottom: 6px;
  font-weight: 700;
}

.cal-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  font-size: 11px;
  color: var(--text-light);
  position: relative;
  cursor: default;
  transition: all 0.15s;
}

.cal-day.today {
  background: rgba(196,168,130,0.15);
  color: var(--text);
  font-weight: 700;
}

.cal-day.has-tea {
  cursor: pointer;
}

.cal-day.has-tea:hover {
  background: rgba(196,168,130,0.12);
  transform: scale(1.1);
}

.cal-day .cal-sticker {
  width: 18px;
  height: 18px;
  margin-top: 1px;
}

.cal-day .cal-sticker svg {
  width: 100%;
  height: 100%;
}

.cal-day.empty { visibility: hidden; }

/* ============ REPORT BUTTON ============ */
.report-buttons {
  display: flex;
  gap: 8px;
}

.report-btn {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: 1.5px solid rgba(196,168,130,0.2);
  background: rgba(255,255,255,0.5);
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 13px;
  color: var(--brown-dark);
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.report-btn:hover {
  background: white;
  transform: translateY(-1px);
  box-shadow: 0 3px 10px rgba(93,78,55,0.08);
}

/* ============ RIGHT PANEL ============ */
.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.journal-header {
  flex-shrink: 0;
  padding: 20px 32px 14px;
  border-bottom: 1px solid rgba(196,168,130,0.12);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.journal-header h2 {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 18px;
  color: var(--brown-dark);
}

.journal-header .tea-count {
  font-size: 12px;
  color: var(--text-light);
  background: rgba(196,168,130,0.12);
  padding: 4px 12px;
  border-radius: 20px;
}

/* ============ JOURNAL AREA ============ */
.journal-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 32px;
  scroll-behavior: smooth;
}

.journal-area::-webkit-scrollbar { width: 3px; }
.journal-area::-webkit-scrollbar-thumb { background: var(--brown); border-radius: 3px; }

/* Welcome */
.welcome-msg {
  text-align: center;
  padding: 40px 20px;
  animation: fade-up 0.6s ease-out;
}

.welcome-msg .emoji { font-size: 48px; margin-bottom: 12px; }
.welcome-msg p { font-size: 14px; color: var(--text-light); line-height: 2; }

@keyframes fade-up {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ JOURNAL ENTRY (手账风格) ============ */
.journal-entry {
  margin-bottom: 24px;
  animation: entry-appear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes entry-appear {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Date divider */
.journal-date-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  margin-top: 8px;
}

.journal-date-divider .date-tag {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 13px;
  color: var(--brown-dark);
  background: rgba(255,255,255,0.6);
  padding: 4px 14px;
  border-radius: 20px;
  border: 1px dashed var(--brown);
  white-space: nowrap;
}

.journal-date-divider .date-line {
  flex: 1;
  height: 1px;
  background: repeating-linear-gradient(90deg, var(--brown) 0, var(--brown) 4px, transparent 4px, transparent 8px);
  opacity: 0.25;
}

/* User input line */
.journal-user-line {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--text-light);
}

.journal-user-line .user-avatar {
  width: 24px;
  height: 24px;
  background: var(--brown);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: white;
  flex-shrink: 0;
}

/* 手账 card */
.journal-card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  position: relative;
  box-shadow: 0 2px 16px rgba(93,78,55,0.06);
  border: 1.5px solid rgba(196,168,130,0.12);
  overflow: hidden;
}

/* Washi tape decoration */
.journal-card::before {
  content: '';
  position: absolute;
  top: -4px;
  left: 30px;
  width: 60px;
  height: 20px;
  border-radius: 2px;
  opacity: 0.6;
  transform: rotate(-2deg);
}

.journal-card[data-brand="喜茶"]::before { background: var(--grape-light); }
.journal-card[data-brand="霸王茶姬"]::before { background: #F0C4BF; }
.journal-card[data-brand="茶颜悦色"]::before { background: #E0CDB8; }
.journal-card[data-brand="茉莉奶白"]::before { background: var(--jasmine-light); }
.journal-card[data-brand="蜜雪冰城"]::before { background: #F5C4C4; }

/* Card inner layout */
.journal-card-top {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  margin-bottom: 14px;
}

.journal-brand-icon {
  width: 50px;
  height: 50px;
  flex-shrink: 0;
  background: rgba(196,168,130,0.06);
  border-radius: 14px;
  padding: 6px;
}

.journal-brand-icon svg { width: 100%; height: 100%; }

.journal-card-info { flex: 1; }

.journal-card-brand {
  font-size: 11px;
  color: var(--text-light);
  font-weight: 700;
  letter-spacing: 1px;
}

.journal-card-drink {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 20px;
  margin-top: 2px;
}

.journal-card[data-brand="喜茶"] .journal-card-drink { color: var(--grape); }
.journal-card[data-brand="霸王茶姬"] .journal-card-drink { color: var(--red-gold); }
.journal-card[data-brand="茶颜悦色"] .journal-card-drink { color: var(--cha-yan); }
.journal-card[data-brand="茉莉奶白"] .journal-card-drink { color: var(--jasmine); }
.journal-card[data-brand="蜜雪冰城"] .journal-card-drink { color: var(--mixue-red); }

/* AI message in journal style */
.journal-ai-msg {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
  margin-bottom: 14px;
  padding: 10px 14px;
  background: linear-gradient(135deg, rgba(245,230,211,0.3), rgba(242,215,217,0.2));
  border-radius: 12px;
  border-left: 3px solid var(--brown);
  font-style: italic;
}

/* Equivalents as stickers */
.journal-stickers {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.journal-sticker {
  font-size: 12px;
  padding: 5px 10px;
  background: rgba(255,255,255,0.7);
  border-radius: 20px;
  border: 1px dashed rgba(196,168,130,0.3);
  color: var(--text);
  transform: rotate(var(--rot, 0deg));
}

.journal-sticker:nth-child(1) { --rot: -1deg; }
.journal-sticker:nth-child(2) { --rot: 1deg; }
.journal-sticker:nth-child(3) { --rot: -0.5deg; }

/* Flip card in journal */
.journal-flip-wrapper {
  perspective: 900px;
  margin-top: 14px;
}

.journal-flip-card {
  position: relative;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 14px;
}

.journal-flip-card.flipped { transform: rotateY(180deg); }

.journal-flip-front, .journal-flip-back {
  backface-visibility: hidden;
  border-radius: 14px;
  padding: 14px 16px;
}

.journal-flip-front {
  background: rgba(255,255,255,0.5);
  border: 1px dashed rgba(196,168,130,0.25);
}

.journal-flip-back {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  transform: rotateY(180deg);
  background: rgba(255,255,255,0.5);
  border: 1px dashed rgba(196,168,130,0.25);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.journal-flip-hint {
  text-align: right;
  font-size: 10px;
  color: var(--text-light);
  opacity: 0.4;
  margin-top: 8px;
}

.exercise-row {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-top: 8px;
}

.exercise-row .ex-item { text-align: center; }
.exercise-row .ex-icon { font-size: 24px; }
.exercise-row .ex-time { font-size: 15px; font-weight: 700; color: var(--text); margin-top: 2px; }
.exercise-row .ex-label { font-size: 10px; color: var(--text-light); }

.exercise-cal {
  text-align: center;
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 4px;
}

.exercise-cal span {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
}

.journal-time-tag {
  font-size: 10px;
  color: var(--text-light);
  opacity: 0.4;
  text-align: right;
  margin-top: 10px;
}

.exercise-cal span {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
}

/* Typing indicator */
.typing-entry {
  margin-bottom: 24px;
  animation: fade-up 0.3s ease-out;
}

.typing-dots {
  display: inline-flex;
  gap: 4px;
  padding: 12px 18px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(93,78,55,0.06);
}

.typing-dots span {
  width: 6px; height: 6px;
  background: var(--brown);
  border-radius: 50%;
  animation: bounce 1.2s ease-in-out infinite;
}

.typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.typing-dots span:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* ============ INPUT BAR ============ */
.input-bar {
  flex-shrink: 0;
  padding: 14px 32px;
  background: rgba(255,248,240,0.85);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(196,168,130,0.15);
}

.input-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
  background: white;
  border-radius: 24px;
  padding: 4px 4px 4px 18px;
  box-shadow: 0 2px 12px rgba(93,78,55,0.08);
  border: 1.5px solid rgba(196,168,130,0.2);
  transition: border-color 0.2s;
}

.input-wrapper:focus-within { border-color: var(--brown); }

.input-wrapper input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  background: transparent;
}

.input-wrapper input::placeholder { color: var(--text-light); opacity: 0.5; }

.send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: none;
  background: var(--brown);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.send-btn:hover { background: var(--brown-dark); transform: scale(1.05); }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.send-btn svg { width: 18px; height: 18px; }

/* ============ DAILY FORTUNE ============ */
.fortune-card {
  margin: 0 0 20px;
  background: white;
  border-radius: 20px;
  padding: 22px;
  position: relative;
  box-shadow: 0 2px 20px rgba(93,78,55,0.08);
  border: 1.5px solid rgba(196,168,130,0.15);
  overflow: hidden;
  animation: fortune-appear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes fortune-appear {
  from { opacity: 0; transform: translateY(-10px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.fortune-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--grape-light), var(--pink), var(--gold), var(--jasmine-light), var(--pink-deep));
}

.fortune-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.fortune-date {
  font-size: 11px;
  color: var(--text-light);
  font-weight: 700;
}

.fortune-streak {
  font-size: 11px;
  color: var(--brown-dark);
  background: rgba(196,168,130,0.12);
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 700;
}

.fortune-main {
  text-align: center;
  padding: 8px 0;
}

.fortune-seal {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  font-size: 14px;
  font-family: 'ZCOOL KuaiLe', cursive;
  color: white;
  margin-bottom: 10px;
  position: relative;
}

.fortune-seal::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 2px dashed currentColor;
  opacity: 0.3;
}

.fortune-seal.daji { background: linear-gradient(135deg, #E8635A, #D4A853); }
.fortune-seal.zhongji { background: linear-gradient(135deg, var(--grape), var(--pink-deep)); }
.fortune-seal.xiaoji { background: linear-gradient(135deg, var(--jasmine), #8BC49A); }
.fortune-seal.ji { background: linear-gradient(135deg, var(--brown), var(--cha-yan)); }

.fortune-level {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 18px;
  color: var(--brown-dark);
  margin-bottom: 6px;
}

.fortune-text {
  font-size: 13px;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 10px;
}

.fortune-recommend {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(245,230,211,0.4);
  border-radius: 20px;
  font-size: 12px;
  color: var(--text-light);
  border: 1px dashed rgba(196,168,130,0.25);
}

.fortune-recommend .rec-icon {
  width: 20px;
  height: 20px;
}

.fortune-recommend .rec-icon svg {
  width: 100%;
  height: 100%;
}

.fortune-dismiss {
  display: block;
  margin: 12px auto 0;
  background: none;
  border: none;
  font-size: 11px;
  color: var(--text-light);
  opacity: 0.4;
  cursor: pointer;
}

.fortune-dismiss:hover { opacity: 0.7; }

/* Streak flames */
.streak-fire {
  display: inline-block;
  margin-right: 2px;
}

/* ============ GACHA CARD REVEAL ============ */
.gacha-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}

.gacha-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.gacha-backdrop {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(93,78,55,0.4);
  backdrop-filter: blur(16px);
}

.gacha-card {
  position: relative;
  width: 340px;
  background: white;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(93,78,55,0.25);
  transform: scale(0.5) rotateY(90deg);
  transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.gacha-overlay.open .gacha-card {
  transform: scale(1) rotateY(0);
}

.gacha-card-banner {
  height: 8px;
}

.gacha-card[data-brand="喜茶"] .gacha-card-banner { background: linear-gradient(90deg, var(--grape), var(--grape-light)); }
.gacha-card[data-brand="霸王茶姬"] .gacha-card-banner { background: linear-gradient(90deg, var(--red-gold), var(--gold)); }

<script>
function checkPwd() {
  const pwd = document.getElementById('pwdInput').value;
  if (pwd === 'naicha') {
    document.getElementById('passwordGate').style.transition = 'opacity 0.4s';

    err.style.opacity = '1';

// ============ CALENDAR ============
function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById('calTitle').textContent = `${year}年${month + 1}月`;

  const firstDay = new Date(year, month, 1);
  let startDay = firstDay.getDay() - 1;
  if (startDay < 0) startDay = 6; // Monday start
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();

  // Get tea data for this month
  const teaDays = {};
  state.history.forEach(h => {
    const d = new Date(h.timestamp);
    if (d.getFullYear() === year && d.getMonth() === month) {
      const day = d.getDate();
      if (!teaDays[day]) teaDays[day] = [];
      teaDays[day].push(h.brand);
    }
  });

  let html = '';
  // Empty cells before first day
  for (let i = 0; i < startDay; i++) {
    html += '<div class="cal-day empty"></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
    const teas = teaDays[d];
    const hasTea = teas && teas.length > 0;
    const lastBrand = hasTea ? teas[teas.length - 1] : null;
    const brandData = lastBrand && BRANDS[lastBrand] ? BRANDS[lastBrand] : null;

    html += `<div class="cal-day ${isToday ? 'today' : ''} ${hasTea ? 'has-tea' : ''}">`;
    html += `<span>${d}</span>`;
    if (brandData) {
      html += `<div class="cal-sticker">${brandData.miniSVG}</div>`;
    }
    html += '</div>';
  }

  document.getElementById('calDays').innerHTML = html;
}

function changeMonth(delta) {
  currentMonth.setMonth(currentMonth.getMonth() + delta);
  renderCalendar();
}

// ============ SEND MESSAGE ============
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isSending) return;

  isSending = true;
  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  // Show user message in journal
  addUserLine(text);
  addTypingIndicator();

  try {
    // Add to conversation history
    conversationHistory.push({ role: 'user', content: text });

    const result = await callDeepSeek();
    removeTypingIndicator();

    if (result.brand && result.drink) {
      // Full record — show gacha card reveal!
      conversationHistory.push({ role: 'assistant', content: JSON.stringify(result) });
      showGachaCard(result, text);
      // Also add to journal (behind the overlay)
      addJournalEntry(result, text);
      updateCollection(result);
      // Clear conversation for next tea
      conversationHistory = [];
    } else if (result.aiMessage) {
      // Still chatting / asking follow-up
      conversationHistory.push({ role: 'assistant', content: JSON.stringify(result) });
      addAiLine(result.aiMessage);
    }
  } catch(err) {
    removeTypingIndicator();
    addAiLine('哎呀，星球信号不太好~ ' + err.message);
  }

  isSending = false;
  document.getElementById('sendBtn').disabled = false;
}

// ============ DEEPSEEK API ============
async function callDeepSeek() {
  const messages = [
    { role: 'system', content: SYSTEM_PROMPT },
    ...conversationHistory
  ];

  const response = await fetch(DEEPSEEK_API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
    },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: messages,
      temperature: 0.8,
      max_tokens: 500
    })
  });

  if (!response.ok) throw new Error(`API 请求失败 (${response.status})`);

  const data = await response.json();
  const content = data.choices?.[0]?.message?.content || '';
  let cleaned = content.trim();
  if (cleaned.startsWith('```')) {
    cleaned = cleaned.replace(/^```(?:json)?\n?/, '').replace(/\n?```$/, '');
  }
  try { return JSON.parse(cleaned); }
  catch(e) { return { aiMessage: content }; }
}

// ============ COLLECTION ============
function updateCollection(data) {
  const brand = data.brand;
  if (!state.collections[brand]) return;
  const wasLocked = !state.collections[brand].unlocked;

  state.collections[brand].unlocked = true;
  state.collections[brand].count += 1;

  if (data.drink) {
    if (!state.collections[brand].drinks[data.drink]) state.collections[brand].drinks[data.drink] = 0;
    state.collections[brand].drinks[data.drink] += 1;
  }

  state.history.push({
    brand: data.brand,
    drink: data.drink,
    calories: data.calories,
    positiveEquivalents: data.positiveEquivalents,
    exerciseEquivalents: data.exerciseEquivalents,
    aiMessage: data.aiMessage,
    timestamp: new Date().toISOString()
  });

  saveState();
  updatePlanet();
  renderAtlas();
  renderCalendar();
  updateTeaCount();

  if (wasLocked) celebratePlanet(brand);
}

  `;

}

function closeReport() {
  document.getElementById('reportOverlay').classList.remove('open');
}

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getDailyFortune() {
  const today = getTodayStr();
  let fortuneState = {};
  try { fortuneState = JSON.parse(localStorage.getItem('milkTeaFortune') || '{}'); } catch(e) {}

  // Check if already signed in today
  if (fortuneState.lastDate === today) {
    return fortuneState;
  }

  // New day — generate fortune
  // Seed random with date for consistency within a day
  const seed = today.split('-').join('') | 0;
  const rand = (n) => ((seed * 9301 + 49297) % 233280) / 233280 * n | 0;

  const fortuneIdx = rand(FORTUNES.length);
  const fortune = FORTUNES[fortuneIdx];
  const textIdx = rand(fortune.texts.length);
  const recIdx = rand(FORTUNE_RECOMMENDS.length);

  // Calculate streak
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;

  let streak = fortuneState.streak || 0;
  if (fortuneState.lastDate === yesterdayStr) {
    streak += 1;
  } else if (fortuneState.lastDate !== today) {
    streak = 1;
  }

  const newState = {
    lastDate: today,
    streak: streak,
    fortune: {
      level: fortune.level,
      cls: fortune.cls,
      seal: fortune.seal,
      text: fortune.texts[textIdx],
      recommend: FORTUNE_RECOMMENDS[recIdx],
    },
    dismissed: false,
  };

  localStorage.setItem('milkTeaFortune', JSON.stringify(newState));
  return newState;
}

function renderFortune() {
  const fortuneState = getDailyFortune();
  if (fortuneState.dismissed) return;

  const f = fortuneState.fortune;
  const rec = f.recommend;
  const brandData = BRANDS[rec.brand];
  const miniSVG = brandData ? brandData.miniSVG : '';

  const now = new Date();
  const dateLabel = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${['周日','周一','周二','周三','周四','周五','周六'][now.getDay()]}`;

  const streakText = fortuneState.streak >= 2
    ? `<span class="streak-fire">🔥</span>连续签到 ${fortuneState.streak} 天`
    : '今日已签到';

  const area = document.getElementById('journalArea');
  const card = document.createElement('div');
  card.className = 'fortune-card';
  card.id = 'fortuneCard';
  card.innerHTML = `
    <div class="fortune-top">
      <span class="fortune-date">${dateLabel}</span>
      <span class="fortune-streak">${streakText}</span>
    </div>
    <div class="fortune-main">
      <div class="fortune-seal ${f.cls}">${f.seal}</div>
      <div class="fortune-level">今日奶茶运势：${f.level}</div>
      <div class="fortune-text">${f.text}</div>
      <div class="fortune-recommend">
        <div class="rec-icon">${miniSVG}</div>
        <span>推荐：${rec.brand}「${rec.drink}」— ${rec.reason}</span>
      </div>
    </div>
    <button class="fortune-dismiss" onclick="dismissFortune()">收起</button>
  `;

  // Insert before welcome or as first child
  const welcome = area.querySelector('.welcome-msg');
  if (welcome) {
    area.insertBefore(card, welcome);
  } else {
    area.prepend(card);
  }
}

function dismissFortune() {
  const card = document.getElementById('fortuneCard');
  if (card) {
    card.style.transition = 'all 0.3s ease';
    card.style.opacity = '0';
    card.style.transform = 'translateY(-10px)';
    setTimeout(() => card.remove(), 300);
  }
  try {
    const s = JSON.parse(localStorage.getItem('milkTeaFortune') || '{}');
    s.dismissed = true;
    localStorage.setItem('milkTeaFortune', JSON.stringify(s));
  } catch(e) {}
}
